version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: her_beautiful_universe_db_dev
    environment:
      POSTGRES_DB: her_beautiful_universe_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dev-network

  # Django Backend (Development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: her_beautiful_universe_backend_dev
    environment:
      - DJANGO_SETTINGS_MODULE=project.settings.development
      - SECRET_KEY=dev-secret-key-not-for-production
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DB_NAME=her_beautiful_universe_dev
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - ./backend:/app
      - media_dev_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - dev-network
    command: python manage.py runserver 0.0.0.0:8000

  # Next.js Frontend (Development)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: her_beautiful_universe_frontend_dev
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dev-network
    command: npm run dev

volumes:
  postgres_dev_data:
  media_dev_volume:

networks:
  dev-network:
    driver: bridge